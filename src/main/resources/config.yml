# NeonItemBlocker - Configuration
# Block specific items (by material type) in specific worlds.
# Blocked material names must be valid Spigot Material enum names (uppercase).

# Action bar warning message (uses MiniMessage format)
warning-message: "<red><bold>You cannot use this item in this world!</bold></red>"

# Map of world names to the list of blocked materials
blocked-items:
  spawn:
    - "WIND_CHARGE"
    - "END_CRYSTAL"
    - "LAVA_BUCKET"
  spawn_nether:
    - "BED"
    - "RESPAWN_ANCHOR"
